spring.datasource.url=jdbc:h2:file:./data/foodhub-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:dev_secret_value_with_more_than_thirty_two_characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.email=${APP_ADMIN_EMAIL:admin@foodhub.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.demo.seed=true
app.restaurants.auto-approve=true
